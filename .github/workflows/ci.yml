name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GITHUB_TOKEN pushes/PRs do not start workflows; the OpenAPI sync dispatches
  # this job onto automation/openapi-sync so the bot PR still gets a CI check.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install hash-locked Python dependencies
        run: pip install -r requirements.txt

      - name: Transform tests (unit + golden-file locks)
        run: python -m pytest tests/ -q

      - name: Provider acceptance checks
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
