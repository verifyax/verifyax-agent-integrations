name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Transform tests (unit + golden-file locks)
        run: python -m pytest tests/ -q

      - name: Lint the derived OpenAPI Actions spec
        run: npx --yes @redocly/cli@1 lint openai/verifyax-actions.yaml
