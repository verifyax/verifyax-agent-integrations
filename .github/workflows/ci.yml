name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GITHUB_TOKEN pushes/PRs do not start workflows; the OpenAPI sync dispatches
  # this job onto automation/openapi-sync so the bot PR still gets a CI check.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install hash-locked Python dependencies
        run: pip install -r requirements.txt

      - name: Transform tests (unit + golden-file locks)
        run: python -m pytest tests/ -q

      - name: Provider acceptance checks
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
