name: Sync OpenAPI spec

# Pull-based sync of the VerifyAX Gateway public OpenAPI spec, plus a rebuild of
# the provider artifacts derived from it (OpenAI Actions, Gemini functions).
#
# The mirror + regenerated artifacts are proposed on a bot pull request only
# after passing the local gates. Required CI and maintainer review promote the
# external input to main; this workflow never writes fetched content to main.

on:
  schedule:
    - cron: "17 6 * * *" # daily ~06:17 UTC (off the :00 mark on purpose)
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the diff-magnitude guard (for a legitimate large upstream change)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write # open a tracking issue when the sync fails
  actions: write # dispatch CI onto the bot branch (GITHUB_TOKEN PRs skip pull_request)

concurrency:
  group: sync-openapi
  cancel-in-progress: false # never interrupt a commit/push mid-flight

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Sync spec from gateway
        run: scripts/sync-openapi.sh

      - name: Diff-magnitude guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          old=$(git show HEAD:openapi/verifyax.yaml 2>/dev/null | wc -l || echo 0)
          new=$(wc -l < openapi/verifyax.yaml)
          echo "mirror lines: old=$old new=$new"
          if [ "$old" -gt 0 ] && [ "${FORCE:-false}" != "true" ]; then
            if [ "$new" -lt $((old / 2)) ]; then
              echo "::error::Mirror shrank from $old to $new lines (>50%) — possible truncation. Re-run with force=true if this is real."
              exit 1
            fi
            changed=$(git diff --numstat -- openapi/verifyax.yaml | awk '{print $1+$2}')
            changed=${changed:-0}
            if [ "$changed" -gt $((old * 6 / 10)) ]; then
              echo "::error::Mirror changed by $changed lines (>60% of $old) — wholesale change. Re-run with force=true if this is real."
              exit 1
            fi
          fi

      - name: Extract spec version
        id: ver
        run: |
          v=$(python3 -c "import yaml;print(yaml.safe_load(open('openapi/verifyax.yaml')).get('info',{}).get('version','unknown'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Rebuild derived provider artifacts
        run: |
          scripts/build-openai-actions.sh
          scripts/build-gemini-functions.sh

      - name: Validate (tests + provider acceptance)
        run: |
          python -m pytest tests/ -q
          npm test

      - name: Build semantic diff summary
        id: drift
        run: |
          paths="openapi/verifyax.yaml openai/verifyax-actions.yaml gemini/verifyax-functions.json gemini/verifyax-functions.meta.json"
          if git diff --quiet -- $paths; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No spec changes."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git show HEAD:openapi/verifyax.yaml > "$RUNNER_TEMP/previous-openapi.yaml"
          python scripts/summarize_openapi_diff.py \
            "$RUNNER_TEMP/previous-openapi.yaml" openapi/verifyax.yaml \
            > "$RUNNER_TEMP/sync-pr-body.md"
          printf '\n## Generated artifact churn\n\n```\n' >> "$RUNNER_TEMP/sync-pr-body.md"
          git diff --stat -- $paths >> "$RUNNER_TEMP/sync-pr-body.md"
          printf '```\n\nGenerated by [%s](%s).\n' \
            "$GITHUB_WORKFLOW" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >> "$RUNNER_TEMP/sync-pr-body.md"
          cat "$RUNNER_TEMP/sync-pr-body.md"

      - name: Push bot branch and open or update pull request
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/openapi-sync
        run: |
          paths="openapi/verifyax.yaml openai/verifyax-actions.yaml gemini/verifyax-functions.json gemini/verifyax-functions.meta.json"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "Sync OpenAPI spec + rebuild provider artifacts (gateway v${{ steps.ver.outputs.version }})"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          # GITHUB_TOKEN git push does not start on.push CI. workflow_dispatch is
          # an explicit exception and attaches the CI check to the bot-branch SHA.
          gh workflow run CI --ref "$BRANCH"

          first_id() { jq -r '.[0].number // empty'; }
          pr_number=$(gh pr list --state open --head "$BRANCH" --json number | first_id)
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "Sync OpenAPI spec (gateway v${{ steps.ver.outputs.version }})" \
              --body-file "$RUNNER_TEMP/sync-pr-body.md"
          else
            if ! gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sync OpenAPI spec (gateway v${{ steps.ver.outputs.version }})" \
              --body-file "$RUNNER_TEMP/sync-pr-body.md"; then
              compare_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
              fallback_body="$RUNNER_TEMP/sync-promotion-issue.md"
              cp "$RUNNER_TEMP/sync-pr-body.md" "$fallback_body"
              printf '\n\nGitHub Actions could not create a PR. A maintainer must review and promote the bot branch using [this compare view](%s).\n' \
                "$compare_url" >> "$fallback_body"
              issue_number=$(gh issue list --state open --search 'OpenAPI sync awaiting promotion in:title' --json number | first_id)
              if [ -n "$issue_number" ]; then
                gh issue edit "$issue_number" --body-file "$fallback_body"
              else
                gh issue create --title 'OpenAPI sync awaiting promotion' --body-file "$fallback_body"
              fi
            fi
          fi

      - name: Open a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf 'The scheduled OpenAPI sync failed and did not update its pull request.\n\nRun: %s\n\nLikely causes: gateway unreachable, the diff-magnitude guard tripped (truncated/wholesale change — re-run with force=true if legitimate), or validation failed.' "$RUN_URL")
          existing=$(gh issue list --state open --search 'OpenAPI sync failed in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title 'OpenAPI sync failed' --body "$body"
          fi
